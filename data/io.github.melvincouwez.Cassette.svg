<!-- Cassette: a tape with a raspberry label, sized to elementary's grid (about 90% of the canvas wide, 80% high) -->
<defs>
<radialGradient id="sh" cx="64" cy="118" r="56" gradientTransform="matrix(1 0 0 .12 0 103.8)" gradientUnits="userSpaceOnUse"><stop offset="0"/><stop offset="1" stop-opacity="0"/></radialGradient>
<linearGradient id="shell" x1="0" y1="16" x2="0" y2="112" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6b6b6b"/><stop offset="1" stop-color="#2e2e2e"/></linearGradient>
<linearGradient id="lbl" x1="0" y1="24" x2="0" y2="84" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff8fab"/><stop offset=".55" stop-color="#e03a64"/><stop offset="1" stop-color="#c42a55"/></linearGradient>
<linearGradient id="reel" x1="0" y1="40" x2="0" y2="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d4d4d4"/></linearGradient>
</defs>
<ellipse cx="64" cy="116" rx="56" ry="6" fill="url(#sh)" opacity=".45"/>
<!-- shell -->
<rect x="5" y="16" width="118" height="96" rx="9" fill="url(#shell)" stroke="#141414" stroke-width="1.5"/>
<rect x="6.5" y="17.5" width="115" height="93" rx="7.5" fill="none" stroke="#fff" stroke-opacity=".2"/>
<g fill="#1a1a1a" opacity=".8"><circle cx="13" cy="24" r="2.2"/><circle cx="115" cy="24" r="2.2"/><circle cx="13" cy="104" r="2.2"/><circle cx="115" cy="104" r="2.2"/></g>
<!-- label -->
<rect x="15" y="24" width="98" height="60" rx="5" fill="url(#lbl)" stroke="#7d0a2c" stroke-opacity=".7"/>
<rect x="16" y="25" width="96" height="4" rx="2" fill="#fff" opacity=".35"/>
<rect x="21" y="32" width="86" height="2.5" rx="1.2" fill="#7d0a2c" opacity=".35"/>
<!-- window with reels -->
<rect x="29" y="42" width="70" height="30" rx="15" fill="#1a1a1a" stroke="#7d0a2c" stroke-opacity=".7"/>
<rect x="50" y="49" width="28" height="16" rx="2.5" fill="#5a3a44"/>
<rect x="50" y="49" width="28" height="3" rx="1.5" fill="#fff" opacity=".12"/>
<g fill="url(#reel)" stroke="#4d4d4d" stroke-width="1"><circle cx="43" cy="57" r="10"/><circle cx="85" cy="57" r="10"/></g>
<g fill="#4d4d4d"><circle cx="43" cy="57" r="3.6"/><circle cx="85" cy="57" r="3.6"/></g>
<g stroke="#4d4d4d" stroke-width="1.6" stroke-linecap="round"><path d="M43 49.5v2.5M43 62v2.5M35.5 57h2.5M48 57h2.5M85 49.5v2.5M85 62v2.5M77.5 57h2.5M90 57h2.5"/></g>
<!-- lower tab -->
<path d="M30 112l6.5-19h55l6.5 19z" fill="#4d4d4d" stroke="#141414" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M37.5 94.5h53" stroke="#fff" stroke-opacity=".15"/>
<g fill="#1a1a1a"><circle cx="47" cy="104" r="3"/><circle cx="81" cy="104" r="3"/><rect x="58" y="100" width="12" height="7" rx="1.5"/></g>
</svg>
